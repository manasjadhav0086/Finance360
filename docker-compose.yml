services:
  # Main Finance360 Application (Frontend SPA + Node Express Backend via Nginx & Supervisor)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-manasjadhav0086/finance360:latest}
    container_name: finance360-app
    env_file:
      - backend/.env
    ports:
      - "4821:4821" # Nginx frontend & API reverse proxy
      - "4820:4820" # Direct Backend API port
    environment:
      - NODE_ENV=production
      # Allows Docker container to connect to host MySQL instance on Windows/Mac/Linux
      - MYSQL_HOST=${MYSQL_HOST:-host.docker.internal}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    restart: unless-stopped

